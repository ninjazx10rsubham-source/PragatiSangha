function loadDB() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      // পুরনো সদস্যপদের ধরন থাকলে নতুন নির্দিষ্ট তালিকায় migrate করুন।
      const oldNames = ["সাধারণ সদস্য", "বিশেষ সদস্য", "আজীবন সদস্য", "সহযোগী সদস্য"];
      if (Array.isArray(parsed.membershipTypes) && parsed.membershipTypes.length && parsed.membershipTypes.every(t => oldNames.includes(t.নাম))) {
        parsed.membershipTypes = defaultMembershipTypes.map(t => ({ ...t }));
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed)); } catch {}
      }
      if (!Array.isArray(parsed.membershipTypes) || parsed.membershipTypes.length === 0) {
        parsed.membershipTypes = defaultMembershipTypes.map(t => ({ ...t }));
      }
      return parsed;
    }
  } catch (e) {
    console.error("DB লোড করতে সমস্যা:", e);
  }
  return {
    members: sampleMembers,
    membershipTypes: defaultMembershipTypes,
    marketCategories: defaultMarketCategories,
    marketEntries: sampleMarket,
    expenses: sampleExpenses,
    otherIncome: 0,
    passwordHash: null, // null হলে ডিফল্ট পাসওয়ার্ড ব্যবহার হবে
    adminPasswordHash: null,
    expenseCategories: ["পুজো", "ভোগ", "সাজসজ্জা", "আলো", "অন্যান্য"],
  };
}

}

// সাধারণ hash (নিরাপত্তার জন্য plain text password DB-তে রাখা এড়াতে)
async function simpleHash(text) {
  try {
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
  } catch (e) {
    // fallback (crypto না থাকলে)
    let h = 0;
    for (let i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) >>> 0;
    return "fb" + h.toString(16);
  }
}

/* ========================= কেন্দ্রীয় হিসাব লজিক ========================= */
function computeTotals(db) {
  const মোটচাঁদা = db.members.reduce((sum, m) => sum + (Number(m.জমা) || 0), 0);
  const মোটবকেয়া = db.members.reduce(
    (sum, m) => sum + Math.max((Number(m.নির্ধারিতচাঁদা) || 0) - (Number(m.জমা) || 0), 0),
    0
  );
  const মোটবাজার = db.marketEntries.reduce((sum, e) => sum + (Number(e.দাম) || 0), 0);
  const মোটখরচ = db.expenses.reduce((sum, e) => sum + (Number(e.পরিমাণ) || 0), 0);
  const অন্যান্যআয় = Number(db.otherIncome) || 0;
  const মোটআয় = মোটচাঁদা + অন্যান্যআয়;
  // সর্বমোট খরচ = সাধারণ খরচ + বাজারের খরচ (বাজারও তো খরচ, তাই হাতে অবশিষ্ট হিসাব করার সময় এটাও বাদ দিতে হবে)
  const সর্বমোটখরচ = মোটখরচ + মোটবাজার;
  const হাতেঅবশিষ্ট = মোটআয় - সর্বমোটখরচ;

  const categoryWiseExpense = {};
  db.expenses.forEach((e) => {
    categoryWiseExpense[e.category] = (categoryWiseExpense[e.category] || 0) + (Number(e.পরিমাণ) || 0);
  });

  return {
    মোটচাঁদা,
    মোটবকেয়া,
    মোটবাজার,
    মোটখরচ,
    সর্বমোটখরচ,
    অন্যান্যআয়,
    মোটআয়,
    হাতেঅবশিষ্ট,
    মোটসদস্য: db.members.length,
    categoryWiseExpense,
  };
}

function formatTaka(n) {
  const num = Number(n) || 0;
  const isNeg = num < 0;
  const abs = Math.abs(Math.round(num));
  const str = abs.toLocaleString("en-IN");
  const bn = str.replace(/[0-9]/g, (d) => "০১২৩৪৫৬৭৮৯"[d]);
  return (isNeg ? "-" : "") + "₹ " + bn;
}

function toBnDigits(n) {
  return String(n).replace(/[0-9]/g, (d) => "০১২৩৪৫৬৭৮৯"[d]);
}

function Toast({ message, type = "success", onDone }) {
  useEffect(() => {
    const t = setTimeout(onDone, 2600);
    return () => clearTimeout(t);
  }, [onDone]);
  const isError = type === "error";
  return (
    <div
      className={`fixed bottom-5 left-1/2 -translate-x-1/2 z-[100] px-5 py-3 rounded-2xl shadow-lg flex items-center gap-2 text-[15px] font-medium ${

    >
      {isError ? <AlertTriangle size={18} /> : <Check size={18} />}
      {message}
    </div>
  );
}

function StatusPill({ status }) {

    "জমা হয়েছে": "bg-[#dcefe0] text-[#2f5233]",
    "আংশিক জমা": "bg-[#faedcf] text-[#8a6a10]",
    "বাকি": "bg-[#fbdede] text-[#8b2e2e]",
  };
  return <span className={`px-2.5 py-1 rounded-full text-xs font-semibold ${map[status] || "bg-gray-100 text-gray-600"}`}>{status}</span>;
}

/* ================================ উৎসবের ছবি Background ================================ */
// দীপাবলি/শ্রী শ্রী শ্যামা পূজার প্রদীপের ছবি — Pexels থেকে (ফ্রি-টু-ইউজ স্টক ছবি)
const FESTIVE_BG_IMAGE =
  "https://images.pexels.com/photos/4094847/pexels-photo-4094847.jpeg?auto=compress&cs=tinysrgb&w=1920";

function FestiveBackground({ variant = "light" }) {
  const isDark = variant === "dark";
  const overlay = isDark
    ? "linear-gradient(180deg, rgba(58,18,16,0.90) 0%, rgba(43,13,16,0.85) 45%, rgba(28,7,8,0.94) 100%)"
    : "linear-gradient(180deg, rgba(253,248,234,0.90) 0%, rgba(253,248,234,0.83) 45%, rgba(253,248,234,0.93) 100%)";
  return (
    <div
      className="fixed inset-0 -z-20 bg-cover bg-center bg-no-repeat"
      style={{ backgroundImage: `${overlay}, url('${FESTIVE_BG_IMAGE}')` }}
      aria-hidden="true"
    />
  );
}

/* ================================ আলপনা Background ================================ */
function AlponaBackground() {
  return (
    <svg
      className="fixed inset-0 w-full h-full pointer-events-none opacity-[0.05] -z-10"
      preserveAspectRatio="xMidYMid slice"
      viewBox="0 0 800 800"
    >
      <defs>
        <pattern id="alpona" width="200" height="200" patternUnits="userSpaceOnUse">
          <circle cx="100" cy="100" r="55" fill="none" stroke="#7a1f2b" strokeWidth="2" />
          <circle cx="100" cy="100" r="35" fill="none" stroke="#c99b3f" strokeWidth="1.5" />
          <path d="M100 45 L100 155 M45 100 L155 100" stroke="#7a1f2b" strokeWidth="1" />
          <path d="M65 65 Q100 40 135 65 Q160 100 135 135 Q100 160 65 135 Q40 100 65 65 Z" fill="none" stroke="#c99b3f" strokeWidth="1" />
        </pattern>
      </defs>
      <rect width="800" height="800" fill="url(#alpona)" />
    </svg>
  );
}

  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [checking, setChecking] = useState(false);

    e.preventDefault();
    setChecking(true);
    setError("");

    const valid = storedHash ? hash === storedHash : hash === defaultHash;

/* ================================ Members Page ================================ */
function emptyMemberForm() {
  return { নাম: "", মোবাইল: "", বাড়ি: "", ধরন: "", নির্ধারিতচাঁদা: "", মন্তব্য: "" };
}

function MemberForm({ initial, membershipTypes, onSubmit, onCancel }) {
  const [form, setForm] = useState(initial || emptyMemberForm());
  const [errors, setErrors] = useState({});

  const set = (k) => (v) => setForm((f) => ({ ...f, [k]: v }));

  const validate = () => {
    const e = {};
    if (!form.নাম || !form.নাম.trim()) e.নাম = "নাম আবশ্যক";
    if (!form.মোবাইল || !/^[0-9]{10}$/.test(form.মোবাইল.trim())) e.মোবাইল = "সঠিক ১০ সংখ্যার মোবাইল নম্বর দিন";
    if (!form.বাড়ি || !form.বাড়ি.trim()) e.বাড়ি = "বাড়ি/ফ্ল্যাট নম্বর আবশ্যক";
    if (!form.ধরন) e.ধরন = "সদস্যের ধরন নির্বাচন করুন";
    if (form.নির্ধারিতচাঁদা === "" || isNaN(Number(form.নির্ধারিতচাঁদা)) || Number(form.নির্ধারিতচাঁদা) < 0)
      e.নির্ধারিতচাঁদা = "সঠিক চাঁদার পরিমাণ দিন";
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const handleSubmit = () => {
    if (!validate()) return;
    onSubmit(form);
  };

  return (
    <div>
      <TextField label="সদস্যের নাম" value={form.নাম} onChange={set("নাম")} error={errors.নাম} required placeholder="যেমন: শ্রী রামু দাস" />
      <TextField label="মোবাইল নম্বর" value={form.মোবাইল} onChange={set("মোবাইল")} error={errors.মোবাইল} required placeholder="১০ সংখ্যার নম্বর" />
      <TextField label="বাড়ি/ফ্ল্যাট নম্বর" value={form.বাড়ি} onChange={set("বাড়ি")} error={errors.বাড়ি} required placeholder="যেমন: ১২/এ" />
      <TextField
        label="সদস্যের ধরন"
        as="select"
        value={form.ধরন}
        onChange={(v) => {
          const type = membershipTypes.find((t) => t.নাম === v);
          setForm((f) => ({ ...f, ধরন: v, নির্ধারিতচাঁদা: type ? type.নির্ধারিতচাঁদা : f.নির্ধারিতচাঁদা }));
        }}
        error={errors.ধরন}
        required
        options={[{ value: "", label: "নির্বাচন করুন" }, ...membershipTypes.filter((t) => t.active).map((t) => ({ value: t.নাম, label: t.নাম }))]}
      />
      <TextField label="চাঁদার পরিমাণ (₹)" type="number" value={form.নির্ধারিতচাঁদা} onChange={set("নির্ধারিতচাঁদা")} error={errors.নির্ধারিতচাঁদা} required />
      <TextField label="মন্তব্য" as="textarea" value={form.মন্তব্য} onChange={set("মন্তব্য")} placeholder="ঐচ্ছিক" />
      <div className="flex gap-3 mt-2">
        <PrimaryButton onClick={onCancel} variant="outline" full>
          বাতিল
        </PrimaryButton>
        <PrimaryButton onClick={handleSubmit} icon={<Check size={17} />} full>
          সংরক্ষণ করুন
        </PrimaryButton>
      </div>
    </div>
  );
}

function PaymentForm({ member, onSubmit, onCancel }) {
  const due = Math.max((Number(member.নির্ধারিতচাঁদা) || 0) - (Number(member.জমা) || 0), 0);
  const [amount, setAmount] = useState(String(due || ""));
  const [date, setDate] = useState(new Date().toISOString().slice(0, 10));
  const [error, setError] = useState("");

  const handleSubmit = () => {
    const num = Number(amount);
    if (amount === "" || isNaN(num) || num <= 0) {
      setError("সঠিক পরিমাণ লিখুন");
      return;
    }
    onSubmit(num, date);
  };

  return (
    <div>
      <p className="text-[#5a4021] mb-4">
        <strong>{member.নাম}</strong> এর বাকি আছে <strong>{formatTaka(due)}</strong>
      </p>
      <TextField label="জমার পরিমাণ (₹)" type="number" value={amount} onChange={setAmount} error={error} required />
      <TextField label="তারিখ" type="date" value={date} onChange={setDate} />
      <div className="flex gap-3 mt-2">
        <PrimaryButton onClick={onCancel} variant="outline" full>
          বাতিল
        </PrimaryButton>
        <PrimaryButton onClick={handleSubmit} icon={<IndianRupee size={17} />} full>
          জমা নিশ্চিত করুন
        </PrimaryButton>
      </div>
    </div>
  );
}

function MembersPage() {
  const { db, updateDB, showToast, membershipTypes } = useApp();
  const [search, setSearch] = useState("");
  const [filter, setFilter] = useState("সবাই");
  const [modal, setModal] = useState(null); // {type, member}
  const [confirmDelete, setConfirmDelete] = useState(null);

  const filtered = useMemo(() => {
    return db.members.filter((m) => {
      if (m.visible === false) return false;
      const matchesSearch =
        !search || m.নাম.toLowerCase().includes(search.toLowerCase()) || m.বাড়ি.toLowerCase().includes(search.toLowerCase());
      const matchesFilter = filter === "সবাই" || m.status === filter;
      return matchesSearch && matchesFilter;
    });
  }, [db.members, search, filter]);

  const deriveStatus = (নির্ধারিতচাঁদা, জমা) => {
    if (জমা <= 0) return "বাকি";
    if (জমা >= নির্ধারিতচাঁদা) return "জমা হয়েছে";
    return "আংশিক জমা";
  };

  const handleAdd = (form) => {
    const duplicate = db.members.some(
      (m) => m.নাম.trim().toLowerCase() === form.নাম.trim().toLowerCase() && m.বাড়ি.trim() === form.বাড়ি.trim()
    );
    if (duplicate) {
      showToast("এই নাম ও বাড়ি নম্বরে একজন সদস্য ইতিমধ্যে আছেন।", "error");
      return;
    }
    const newMember = {
      id: "mem_" + Date.now(),
      ক্রমিক: db.members.length + 1,
      নাম: form.নাম.trim(),
      মোবাইল: form.মোবাইল.trim(),
      বাড়ি: form.বাড়ি.trim(),
      ধরন: form.ধরন,
      নির্ধারিতচাঁদা: Number(form.নির্ধারিতচাঁদা),
      জমা: 0,
      status: "বাকি",
      তারিখ: "",
      মন্তব্য: form.মন্তব্য || "",
    };
    updateDB((d) => ({ ...d, members: [...d.members, newMember] }));
    showToast("নাগরিকের তথ্য সফলভাবে যুক্ত হয়েছে।");
    setModal(null);
  };

  const handleEdit = (form) => {
    updateDB((d) => ({
      ...d,
      members: d.members.map((m) =>
        m.id === modal.member.id
          ? {
              ...m,
              নাম: form.নাম.trim(),
              মোবাইল: form.মোবাইল.trim(),
              বাড়ি: form.বাড়ি.trim(),
              ধরন: form.ধরন,
              নির্ধারিতচাঁদা: Number(form.নির্ধারিতচাঁদা),
              মন্তব্য: form.মন্তব্য || "",
              status: deriveStatus(Number(form.নির্ধারিতচাঁদা), m.জমা),
            }
          : m
      ),
    }));
    showToast("সদস্যের তথ্য সফলভাবে হালনাগাদ হয়েছে।");
    setModal(null);
  };

  const handlePayment = (amount, date) => {
    updateDB((d) => ({
      ...d,
      members: d.members.map((m) => {
        if (m.id !== modal.member.id) return m;
        const newপaid = (Number(m.জমা) || 0) + amount;
        return { ...m, জমা: newপaid, তারিখ: date, status: deriveStatus(m.নির্ধারিতচাঁদা, newপaid) };
      }),
    }));
    showToast("চাঁদা সফলভাবে সংরক্ষিত হয়েছে।");
    setModal(null);
  };

  const handleDelete = () => {
    updateDB((d) => ({ ...d, members: d.members.filter((m) => m.id !== confirmDelete.id) }));
    showToast("নাগরিকের তথ্য মুছে ফেলা হয়েছে।");
    setConfirmDelete(null);
  };

  return (
    <div className="p-4 sm:p-6 lg:p-8 max-w-6xl mx-auto">
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
        <h1 className="text-2xl font-bold text-[#3a1210]">সদস্য ও চাঁদা</h1>
        <PrimaryButton onClick={() => setModal({ type: "add" })} icon={<Plus size={18} />}>

      <div className="flex flex-col sm:flex-row gap-3 mb-5">

          <input
            value={search}
            onChange={(e) => setSearch(e.target.value)}
            placeholder="নাম বা বাড়ির নম্বর দিয়ে খুঁজুন"
            className="w-full pl-10 pr-4 py-2.5 rounded-xl border border-[#e0cfa0] bg-[#fffcf5] outline-none focus:border-[#7a1f2b] text-[#3a1210]"
          />
        </div>
        <div className="flex gap-2 overflow-x-auto">
          {["সবাই", "জমা হয়েছে", "আংশিক জমা", "বাকি"].map((f) => (
            <button

              onClick={() => setFilter(f)}
              className={`px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-colors ${
                filter === f ? "bg-[#7a1f2b] text-[#f8ecd0]" : "bg-[#fffcf5] border border-[#e0cfa0] text-[#5a4021]"
              }`}
            >
              {f}
            </button>
          ))}
        </div>
      </div>

      {filtered.length === 0 ? (
        <EmptyState text={db.members.length === 0 ? "এখনও কোনো সদস্য যোগ করা হয়নি।" : "কোনো ফলাফল পাওয়া যায়নি।"} />
      ) : (
        <>
          {/* Desktop table */}
          <div className="hidden md:block rounded-2xl border border-[#e4d3a8] overflow-hidden bg-[#fffcf5]">
            <table className="w-full text-sm">
              <thead className="bg-[#f1e6c8] text-[#5a4021]">
                <tr>
                  <th className="px-4 py-3 text-left">নাম</th>
                  <th className="px-4 py-3 text-left">বাড়ি</th>

              <tbody>
                {filtered.map((m, idx) => (

                    <td className="px-4 py-3 text-center">

          <div className="md:hidden space-y-3">

                </div>
              </div>
            ))}
          </div>
        </>
      )}

      {modal?.type === "add" && (
        <Modal title="নাগরিক বৃন্দ ও চাঁদা" onClose={() => setModal(null)}>
          <MemberForm membershipTypes={membershipTypes} onSubmit={handleAdd} onCancel={() => setModal(null)} />
        </Modal>
      )}
      {modal?.type === "edit" && (
        <Modal title="সদস্যের তথ্য সম্পাদনা" onClose={() => setModal(null)}>

/* ================================ Market Page ================================ */
function MarketForm({ initial, categories, onSubmit, onCancel }) {
  const [form, setForm] = useState(
    initial || { বাজার: categories[0]?.নাম || "", দোকান: "", কী: "", পরিমাণ: "", দাম: "", তারিখ: new Date().toISOString().slice(0, 10), মন্তব্য: "" }
  );
  const [errors, setErrors] = useState({});
  const set = (k) => (v) => setForm((f) => ({ ...f, [k]: v }));

  const validate = () => {
    const e = {};
    if (!form.কী || !form.কী.trim()) e.কী = "কী কেনা হয়েছে তা লিখুন";
    if (form.দাম === "" || isNaN(Number(form.দাম)) || Number(form.দাম) < 0) e.দাম = "সঠিক দাম দিন";
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  return (
    <div>
      <TextField label="বাজারের নাম" as="select" value={form.বাজার} onChange={set("বাজার")} options={categories.map((c) => ({ value: c.নাম, label: c.নাম }))} />
      <TextField label="দোকান/বিক্রেতার নাম" value={form.দোকান} onChange={set("দোকান")} placeholder="ঐচ্ছিক" />
      <TextField label="কী কেনা হয়েছে" value={form.কী} onChange={set("কী")} error={errors.কী} required />
      <TextField label="পরিমাণ" value={form.পরিমাণ} onChange={set("পরিমাণ")} placeholder="যেমন: ৫ কেজি" />
      <TextField label="দাম (₹)" type="number" value={form.দাম} onChange={set("দাম")} error={errors.দাম} required />
      <TextField label="তারিখ" type="date" value={form.তারিখ} onChange={set("তারিখ")} />
      <TextField label="মন্তব্য" as="textarea" value={form.মন্তব্য} onChange={set("মন্তব্য")} placeholder="ঐচ্ছিক" />
      <div className="flex gap-3 mt-2">
        <PrimaryButton onClick={onCancel} variant="outline" full>
          বাতিল
        </PrimaryButton>
        <PrimaryButton
          onClick={() => {
            if (validate()) onSubmit(form);
          }}
          icon={<Check size={17} />}
          full
        >
          সংরক্ষণ করুন
        </PrimaryButton>
      </div>
    </div>
  );
}

                    <Pencil size={15} />

                  <button onClick={() => setConfirmDelete(e)} className="p-1.5 rounded-lg hover:bg-[#fbdede] text-[#8b2e2e]">

      {confirmDelete && <ConfirmDialog message="আপনি কি সত্যিই এই বাজারের তথ্যটি মুছে ফেলতে চান?" onConfirm={handleDelete} onCancel={() => setConfirmDelete(null)} />}
    </div>
  );
}

/* ================================ Expenses Page ================================ */

function ExpenseForm({ initial, categories = EXPENSE_CATEGORIES, onSubmit, onCancel }) {
  const [form, setForm] = useState(

  );
  const [errors, setErrors] = useState({});
  const set = (k) => (v) => setForm((f) => ({ ...f, [k]: v }));

  const validate = () => {

/* ================================ Calculator Page ================================ */
function BasicCalculator() {
  const [expr, setExpr] = useState("");
  const [display, setDisplay] = useState("০");

  const press = (val) => {
    if (val === "C") {
      setExpr("");
      setDisplay("০");
      return;
    }
    if (val === "=") {
      try {
        // নিরাপদ evaluation: শুধু সংখ্যা ও অপারেটর
        if (!/^[0-9+\-*/.% ]*$/.test(expr)) throw new Error("invalid");
        // eslint-disable-next-line no-eval
        const result = Function('"use strict"; return (' + expr.replace(/%/g, "/100") + ")")();
        setDisplay(toBnDigits(Number.isFinite(result) ? +result.toFixed(4) : "ভুল"));
        setExpr(String(result));
      } catch {
        setDisplay("ভুল হিসাব");
        setExpr("");
      }
      return;
    }
    const newExpr = expr + val;
    setExpr(newExpr);
    setDisplay(toBnDigits(newExpr));
  };

  const keys = ["7", "8", "9", "÷", "4", "5", "6", "×", "1", "2", "3", "−", "0", ".", "%", "="];
  const opMap = { "÷": "/", "×": "*", "−": "-" };

  return (
    <div className="rounded-2xl border border-[#e4d3a8] bg-[#fffcf5] p-5 max-w-sm">
      <div className="bg-[#3a1210] text-[#f8ecd0] rounded-xl px-4 py-5 text-right text-2xl font-bold mb-4 tabular-nums break-all min-h-[64px] flex items-end justify-end">
        {display}
      </div>
      <div className="grid grid-cols-4 gap-2">
        <button onClick={() => press("C")} className="col-span-4 py-3 rounded-xl bg-[#8b2e2e] text-white font-semibold">
          পরিষ্কার করুন (C)
        </button>
        {keys.map((k) => (
          <button
            key={k}
            onClick={() => press(k === "=" ? "=" : opMap[k] || k)}
            className={`py-3 rounded-xl font-semibold text-lg ${
              k === "="
                ? "bg-[#7a1f2b] text-[#f8ecd0] col-span-1"
                : ["÷", "×", "−", "%"].includes(k)
                ? "bg-[#c99b3f]/25 text-[#7a1f2b]"
                : "bg-[#f6efd8] text-[#3a1210]"
            }`}
          >
            {["÷", "×", "−", "%"].includes(k) ? k : toBnDigits(k)}
          </button>
        ))}
      </div>
    </div>
  );
}

  };
  const deleteRecord = (collection, id) => {
    updateDB(d => ({ ...d, [collection]: d[collection].filter(x => x.id !== id) }));
    showToast("তথ্য মুছে ফেলা হয়েছে।");
  };
  const addMarketCategory = () => {
    const name = newCategory.trim();
    if (!name) return;
    if ((db.marketCategories || []).some(c => c.নাম === name)) return showToast("এই বিভাগটি আগে থেকেই আছে।", "error");
    updateDB(d => ({ ...d, marketCategories: [...(d.marketCategories || []), { id: "mkc_" + Date.now(), নাম: name }] }));

  const addExpenseCategory = () => {
    const name = newExpenseCategory.trim();

    const cats = d => d.expenseCategories || EXPENSE_CATEGORIES;

  const addMembershipTypeAdmin = () => {

    setNewType({ নাম: "", নির্ধারিতচাঁদা: "", description: "" }); showToast("নতুন সদস্যপদ যোগ হয়েছে।");
  };
  const changeAdminPassword = async () => {

    if (newAdminPass !== confirmAdminPass) return showToast("দুটি পাসওয়ার্ড মিলছে না।", "error");
    const hash = await simpleHash(newAdminPass);
    updateDB(d => ({ ...d, adminPasswordHash: hash }));
    setNewAdminPass(""); setConfirmAdminPass(""); showToast("অ্যাডমিন পাসওয়ার্ড পরিবর্তন হয়েছে।");
  };
  const visibleLabel = x => x.visible === false ? "ব্যবহারকারীদের কাছে লুকানো" : "ব্যবহারকারীরা দেখতে পাবেন";

  return (
    <div className="p-4 sm:p-6 lg:p-8 max-w-6xl mx-auto space-y-6">
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div><h1 className="text-2xl font-bold text-[#3a1210]">অ্যাডমিন প্যানেল</h1><p className="text-sm text-[#8a6a3f]">এখান থেকে পুরো অ্যাপের তথ্য নিয়ন্ত্রণ করুন</p></div>
        <PrimaryButton variant="outline" onClick={() => setIsAdmin(false)}>অ্যাডমিন মোড বন্ধ করুন</PrimaryButton>
      </div>

      <div className="rounded-2xl border border-[#e4d3a8] bg-[#fffcf5] p-5">
        <h3 className="font-bold text-[#3a1210] mb-3">সদস্য ও চাঁদা ব্যবস্থাপনা</h3>
        <div className="space-y-2">
          {db.members.map(m => <div key={m.id} className="flex items-center justify-between gap-3 bg-[#f6efd8] rounded-xl px-4 py-3"><div><b>{m.নাম}</b><div className="text-xs text-[#a17c46]">{m.বাড়ি} · {m.ধরন} · {visibleLabel(m)}</div></div><div className="flex gap-1"><button onClick={() => toggleVisibility("members", m.id)} className="px-2 py-1 text-xs rounded-lg bg-white">{m.visible === false ? "দেখান" : "লুকান"}</button><button onClick={() => deleteRecord("members", m.id)} className="p-1.5 text-[#8b2e2e]"><Trash2 size={15}/></button></div></div>)}
        </div>
      </div>

      <div className="rounded-2xl border border-[#e4d3a8] bg-[#fffcf5] p-5">
        <h3 className="font-bold text-[#3a1210] mb-3">বাজারের তথ্য</h3>
        <div className="space-y-2">
          {db.marketEntries.map(e => <div key={e.id} className="flex items-center justify-between gap-3 bg-[#f6efd8] rounded-xl px-4 py-3"><div><b>{e.কী}</b><div className="text-xs text-[#a17c46]">{e.বাজার} · {formatTaka(e.দাম)} · {visibleLabel(e)}</div></div><div className="flex gap-1"><button onClick={() => toggleVisibility("marketEntries", e.id)} className="px-2 py-1 text-xs rounded-lg bg-white">{e.visible === false ? "দেখান" : "লুকান"}</button><button onClick={() => deleteRecord("marketEntries", e.id)} className="p-1.5 text-[#8b2e2e]"><Trash2 size={15}/></button></div></div>)}
        </div>
      </div>

      <div className="rounded-2xl border border-[#e4d3a8] bg-[#fffcf5] p-5">
        <h3 className="font-bold text-[#3a1210] mb-3">খরচের তথ্য</h3>
        <div className="space-y-2">
          {db.expenses.map(e => <div key={e.id} className="flex items-center justify-between gap-3 bg-[#f6efd8] rounded-xl px-4 py-3"><div><b>{e.নাম}</b><div className="text-xs text-[#a17c46]">{e.category} · {formatTaka(e.পরিমাণ)} · {visibleLabel(e)}</div></div><div className="flex gap-1"><button onClick={() => toggleVisibility("expenses", e.id)} className="px-2 py-1 text-xs rounded-lg bg-white">{e.visible === false ? "দেখান" : "লুকান"}</button><button onClick={() => deleteRecord("expenses", e.id)} className="p-1.5 text-[#8b2e2e]"><Trash2 size={15}/></button></div></div>)}
        </div>
      </div>

      <div className="rounded-2xl border border-[#e4d3a8] bg-[#fffcf5] p-5">
        <h3 className="font-bold text-[#3a1210] mb-3">নতুন বাজার বিভাগ</h3>
        <div className="flex gap-2"><input value={newCategory} onChange={e=>setNewCategory(e.target.value)} placeholder="যেমন: মিষ্টি" className="flex-1 px-3.5 py-2.5 rounded-xl border border-[#e0cfa0] bg-white"/><PrimaryButton onClick={addMarketCategory} icon={<Plus size={17}/>}>বিভাগ যোগ করুন</PrimaryButton></div>
        <div className="flex flex-wrap gap-2 mt-3">{(db.marketCategories || []).map(c=><span key={c.id} className="px-3 py-1 rounded-full bg-[#f6efd8] text-sm">{c.নাম}</span>)}</div>

/* ================================ Settings Page ================================ */
function SettingsPage() {
  const { db, updateDB, showToast, membershipTypes, resetPasswordHash } = useApp();
  const [newType, setNewType] = useState({ নাম: "", নির্ধারিতচাঁদা: "", description: "" });
  const [oldPass, setOldPass] = useState("");
  const [newPass, setNewPass] = useState("");
  const [confirmPass, setConfirmPass] = useState("");
  const [passError, setPassError] = useState("");
  const [passSuccess, setPassSuccess] = useState("");

  const addMembershipType = () => {
    const name = newType.নাম.trim();
    if (!name) {
      showToast("সদস্যের ধরন লিখুন", "error");
      return;
    }
    if (db.membershipTypes.length >= 30) {
      showToast("সর্বোচ্চ ৩০টি সদস্যের ধরন যোগ করা যাবে।", "error");
      return;
    }
    if (db.membershipTypes.some(t => t.নাম.trim() === name)) {
      showToast("এই সদস্যের ধরনটি আগে থেকেই আছে।", "error");
      return;
    }
    updateDB((d) => ({
      ...d,
      membershipTypes: [
        ...(Array.isArray(d.membershipTypes) ? d.membershipTypes : []),
        { id: "m_" + Date.now(), নাম: name, নির্ধারিতচাঁদা: 0, description: "", active: true },
      ],
    }));
    setNewType({ নাম: "", নির্ধারিতচাঁদা: "", description: "" });
    showToast("নতুন সদস্যের ধরন যোগ হয়েছে।");
  };

  const toggleType = (id) => {
    updateDB((d) => ({ ...d, membershipTypes: d.membershipTypes.map((t) => (t.id === id ? { ...t, active: !t.active } : t)) }));
  };

  const deleteType = (id) => {
    if (!id) return;
    const target = db.membershipTypes.find(t => t.id === id);
    if (!target) return;
    updateDB((d) => ({ ...d, membershipTypes: (d.membershipTypes || []).filter((t) => t.id !== id) }));
    showToast(`“${target.নাম}” মুছে ফেলা হয়েছে।`);
  };

  const handleExport = () => {
    const dataStr = JSON.stringify(db, null, 2);
    const blob = new Blob([dataStr], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `pragati-sangha-kalipuja-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast("ডেটা ব্যাকআপ ডাউনলোড হয়েছে।");
  };

  const handleImport = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (!parsed.members || !parsed.expenses) throw new Error("invalid");
        updateDB(() => parsed);
        showToast("ডেটা সফলভাবে পুনরুদ্ধার হয়েছে।");
      } catch {
        showToast("ব্যাকআপ ফাইলটি সঠিক নয়।", "error");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const handleChangePassword = async () => {
    setPassError("");
    setPassSuccess("");
    if (!newPass || newPass.length < 4) {
      setPassError("নতুন পাসওয়ার্ড কমপক্ষে ৪ অক্ষরের হতে হবে।");
      return;
    }
    if (newPass !== confirmPass) {
      setPassError("নতুন পাসওয়ার্ড দুটি মিলছে না।");
      return;
    }
    const oldHash = await simpleHash(oldPass);
    const currentHash = db.passwordHash || (await simpleHash(DEFAULT_PASSWORD));
    if (oldHash !== currentHash) {
      setPassError("বর্তমান পাসওয়ার্ড সঠিক নয়।");
      return;
    }
    const newHash = await simpleHash(newPass);
    updateDB((d) => ({ ...d, passwordHash: newHash }));
    resetPasswordHash(newHash);
    setOldPass("");
    setNewPass("");
    setConfirmPass("");
    setPassSuccess("পাসওয়ার্ড সফলভাবে পরিবর্তিত হয়েছে।");
    showToast("পাসওয়ার্ড পরিবর্তন করা হয়েছে।");
  };

  return (
    <div className="p-4 sm:p-6 lg:p-8 max-w-4xl mx-auto space-y-6">
      <h1 className="text-2xl font-bold text-[#3a1210]">সেটিংস</h1>

      {/* Membership Types */}
      <div className="rounded-2xl border border-[#e4d3a8] bg-[#fffcf5] p-5">
        <h3 className="font-bold text-[#3a1210] mb-1">সদস্যপদ ব্যবস্থাপনা</h3>
        <p className="text-xs text-[#a17c46] mb-4">সর্বোচ্চ ৩০টি সদস্যপদ তৈরি করা যাবে ({toBnDigits(db.membershipTypes.length)}/৩০)</p>
        <div className="space-y-2 mb-4">
          {db.membershipTypes.map((t) => (
            <div key={t.id} className="flex items-center justify-between gap-3 bg-[#f6efd8] rounded-xl px-4 py-3">
              <div className="min-w-0">
                <div className="font-medium text-[#3a1210]">{t.নাম}</div>
                <div className="text-xs text-[#a17c46]">সদস্যের ধরন</div>
              </div>
              <div className="flex items-center gap-2 shrink-0">
                <button
                  onClick={() => toggleType(t.id)}
                  className={`text-xs px-2.5 py-1 rounded-full font-medium ${t.active ? "bg-[#dcefe0] text-[#2f5233]" : "bg-gray-200 text-gray-500"}`}
                >
                  {t.active ? "সক্রিয়" : "নিষ্ক্রিয়"}
                </button>
                <button onClick={() => deleteType(t.id)} className="p-1.5 rounded-lg hover:bg-[#fbdede] text-[#8b2e2e]">
                  <Trash2 size={15} />
                </button>
              </div>
            </div>
          ))}
        </div>
        <div className="flex flex-col sm:flex-row gap-2">
          <input
            value={newType.নাম}
            onChange={(e) => setNewType((f) => ({ ...f, নাম: e.target.value }))}
            placeholder="নতুন সদস্যপদের নাম"
            className="flex-1 px-3.5 py-2.5 rounded-xl border border-[#e0cfa0] bg-white outline-none focus:border-[#7a1f2b] text-[#3a1210]"
          />
          <PrimaryButton onClick={addMembershipType} icon={<Plus size={17} />}>
            যোগ করুন
          </PrimaryButton>
        </div>
      </div>

      {/* Password Change */}
      <div className="rounded-2xl border border-[#e4d3a8] bg-[#fffcf5] p-5">
        <h3 className="font-bold text-[#3a1210] mb-4">পাসওয়ার্ড পরিবর্তন করুন</h3>
        <TextField label="বর্তমান পাসওয়ার্ড" type="password" value={oldPass} onChange={setOldPass} />
        <TextField label="নতুন পাসওয়ার্ড" type="password" value={newPass} onChange={setNewPass} />
        <TextField label="নতুন পাসওয়ার্ড আবার লিখুন" type="password" value={confirmPass} onChange={setConfirmPass} />
        {passError && <p className="text-[#8b2e2e] text-sm mb-3">{passError}</p>}
        {passSuccess && <p className="text-[#2f5233] text-sm mb-3">{passSuccess}</p>}
        <PrimaryButton onClick={handleChangePassword} icon={<Check size={17} />}>
          পাসওয়ার্ড পরিবর্তন করুন
        </PrimaryButton>
      </div>

      {/* Backup/Restore */}
      <div className="rounded-2xl border border-[#e4d3a8] bg-[#fffcf5] p-5">
        <h3 className="font-bold text-[#3a1210] mb-1">ডেটা ব্যাকআপ ও পুনরুদ্ধার</h3>
        <p className="text-xs text-[#a17c46] mb-4">সব তথ্য JSON ফাইল হিসেবে সংরক্ষণ করুন, প্রয়োজনে পরে ফিরিয়ে আনুন।</p>
        <div className="flex flex-col sm:flex-row gap-3">
          <PrimaryButton onClick={handleExport} icon={<Download size={18} />} variant="outline">
            ডেটা ব্যাকআপ (Export)
          </PrimaryButton>
          <label className="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl font-medium text-[15px] border-2 border-[#7a1f2b] text-[#7a1f2b] hover:bg-[#7a1f2b]/5 cursor-pointer transition-colors">
            <Upload size={18} />
            ডেটা পুনরুদ্ধার (Restore)
            <input type="file" accept="application/json" onChange={handleImport} className="hidden" />
          </label>
        </div>
      </div>
    </div>
  );
}

/* ================================ Main App ================================ */
function App() {
  const [db, setDb] = useState(loadDB);
  const [loggedIn, setLoggedIn] = useState(false);
  const [page, setPage] = useState("dashboard");
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [toast, setToast] = useState(null);
  const [passwordHash, setPasswordHash] = useState(null);
  const [isAdmin, setIsAdmin] = useState(false);

  useEffect(() => {
    setPasswordHash(db.passwordHash || null);
  }, []); // eslint-disable-line

  const showToast = useCallback((message, type = "success") => {
    setToast({ message, type });
  }, []);

  const updateDB = useCallback((updater) => {
    if (!isAdmin) {
      showToast("শুধুমাত্র অ্যাডমিন তথ্য পরিবর্তন করতে পারবেন।", "error");
      return;
    }
    setDb((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      saveDB(next);
      return next;
    });
  }, [isAdmin, showToast]);

  useEffect(() => {
    const onStorage = (event) => {
      if (event.key === STORAGE_KEY && event.newValue) {
        try { setDb(JSON.parse(event.newValue)); } catch {}
      }
    };
    window.addEventListener("storage", onStorage);
    return () => window.removeEventListener("storage", onStorage);
  }, []);

  const totals = useMemo(() => computeTotals(db), [db]);

  const contextValue = {
    db,
    updateDB,
    showToast,
    totals,
    membershipTypes: db.membershipTypes,
    resetPasswordHash: setPasswordHash,
    isAdmin,
    setIsAdmin,
  };

  if (!loggedIn) {
    return (
      <div style={{ fontFamily: "'Noto Sans Bengali', 'Hind Siliguri', sans-serif" }}>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <style>{`@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap');`}</style>
        <LoginScreen onSuccess={() => setLoggedIn(true)} storedHash={passwordHash} />
      </div>
    );
  }

  const currentLabel = NAV_ITEMS.find((n) => n.key === page)?.label || "";

  const renderPage = () => {
    switch (page) {
      case "dashboard":
        return <DashboardPage />;
      case "members":
        return <MembersPage />;
      case "market":
        return <MarketPage />;
      case "expenses":
        return <ExpensesPage />;
      case "calculator":
        return <CalculatorPage />;
      case "summary":
        return <SummaryPage />;
      case "reports":
        return <ReportsPage />;
      case "settings":
        return <SettingsPage />;
      case "admin":
        return <AdminPage />;
      default:
        return <DashboardPage />;
    }
  };

  return (
    <AppContext.Provider value={contextValue}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap');
        * { font-family: 'Noto Sans Bengali', 'Hind Siliguri', sans-serif; }
        @media print {
          .print\\:hidden { display: none !important; }
          aside, .lg\\:hidden { display: none !important; }
        }
      `}</style>
      <div className="min-h-screen bg-[#fdf8ea] flex">
        <FestiveBackground variant="light" />
        <Sidebar current={page} onNavigate={setPage} open={sidebarOpen} onClose={() => setSidebarOpen(false)} onLogout={() => setLoggedIn(false)} />
        <div className="flex-1 min-w-0 relative">
          <AlponaBackground />
          <TopBar onMenuClick={() => setSidebarOpen(true)} title={currentLabel} />
          {renderPage()}
        </div>
      </div>
      {toast && <Toast message={toast.message} type={toast.type} onDone={() => setToast(null)} />}
    </AppContext.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
<script>
  // Babel-কে classic JSX runtime ব্যবহার করতে বাধ্য করা হচ্ছে, যাতে
  // "import ... from react/jsx-runtime" জেনারেট না হয় (UMD React-এ এটি কাজ করে না)।
  (function () {
    const source = document.getElementById("app-source").textContent;
    try {
      const output = Babel.transform(source, {
        presets: [
          ["react", { runtime: "classic" }],
          ["env", { targets: { chrome: "90", firefox: "88", safari: "14", edge: "90" } }],
        ],
        filename: "app.jsx",
      }).code;
      const script = document.createElement("script");
      script.textContent = output;
      document.body.appendChild(script);
    } catch (err) {
      document.getElementById("root").innerHTML =
        '<div style="padding:2rem;font-family:sans-serif;color:#8b2e2e;background:#fdf8ea;min-height:100vh;">' +
        "<h2>দুঃখিত, অ্যাপ্লিকেশন লোড করতে সমস্যা হয়েছে।</h2><pre style=\"white-space:pre-wrap;font-size:12px;\">" +
        String(err && err.message ? err.message : err) +
        "</pre></div>";
      console.error(err);
    }
  })();
</script>
</body></html>
